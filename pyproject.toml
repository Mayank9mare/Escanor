[project]
name = "escanor"
version = "0.1.0"
description = "A local, Jarvis-style personal assistant: second brain, research tutor, AI DJ, voice."
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.60"]
openai = ["openai>=1.40"]
all-models = ["anthropic>=0.60", "openai>=1.40"]
voice = ["faster-whisper>=1.0", "piper-tts>=1.7"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.30"]
listen = ["sounddevice>=0.4", "openwakeword>=0.6"]
music = ["ytmusicapi>=1.8"]
research = ["pypdf>=4"]
mcp = ["mcp>=2.3"]
menubar = ["rumps>=0.4"]
remote = ["qrcode>=7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
escanor = "escanor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["escanor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
