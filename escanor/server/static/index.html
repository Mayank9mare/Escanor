<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escanor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="sun" aria-hidden="true"></span>Escanor</div>
    <div class="controls">
      <select id="model" aria-label="Model"></select>
      <label class="toggle"><input type="checkbox" id="speak-typed"> speak typed replies</label>
      <button id="new" type="button">New</button>
    </div>
  </header>

  <main id="log" aria-live="polite"></main>

  <div id="status" role="status"></div>

  <form id="composer">
    <button id="mic" type="button" aria-label="Hold to talk (or hold Space)" title="Hold to talk (or hold Space)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <input id="input" autocomplete="off" placeholder="Ask Escanor…  (hold Space to talk)">
    <button id="send" type="submit">Send</button>
  </form>

  <dialog id="confirm">
    <p id="confirm-text"></p>
    <div class="row">
      <button id="deny" type="button">No</button>
      <button id="allow" type="button" class="primary">Allow</button>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
