<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0503">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Escanor">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" href="/static/icon-192.png">
  <title>Escanor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-state="idle">
  <header class="bar">
    <div class="brand">
      <svg class="sigil" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4M4.6 4.6l2.8 2.8M16.6 16.6l2.8 2.8M4.6 19.4l2.8-2.8M16.6 7.4l2.8-2.8"/></svg>
      <span>ESCANOR</span><span class="title">THE LION'S SIN OF PRIDE</span>
    </div>
    <div class="controls">
      <select id="model" aria-label="Model"></select>
      <label class="toggle"><input type="checkbox" id="speak-typed"> voice replies to text</label>
      <button id="voice" type="button" title="Switch voice (V)" hidden>Voice</button>
      <button id="sound" type="button" aria-pressed="true" title="Sound cues">Sound</button>
      <button id="toggle-log" type="button" aria-pressed="true" title="Transcript (T)">Transcript</button>
      <button id="new" type="button">New</button>
    </div>
  </header>

  <main class="stage">
    <section class="hud" aria-label="Escanor status">
      <div class="sun-stack">
        <canvas id="sun" aria-hidden="true"></canvas>
        <canvas id="core" aria-hidden="true"></canvas>
      </div>
      <div class="readout">
        <div id="state-label" class="state-label">BASKING</div>
        <div id="clock" class="clock"></div>
        <div class="power" aria-label="Solar power">
          <div class="power-label"><span id="power-name">SOLAR POWER</span><span id="power-value"></span></div>
          <div class="power-track"><div id="power-fill" class="power-fill"></div></div>
        </div>
      </div>
      <p id="caption" class="caption" aria-live="polite"></p>
      <ol id="ops" class="ops" aria-label="Recent actions"></ol>
    </section>

    <aside id="log-panel" class="log-panel" aria-label="Transcript">
      <div class="panel-title">TRANSCRIPT <span id="conversation-id"></span></div>
      <div id="log" class="log"></div>
    </aside>
  </main>

  <div id="status" class="status" role="status"></div>
  <div class="keys" aria-hidden="true"><kbd>Space</kbd> talk · <kbd>⌘K</kbd> type · <kbd>Esc</kbd> interrupt · <kbd>T</kbd> transcript</div>

  <form id="composer" class="composer">
    <button id="mic" type="button" aria-label="Hold to talk (or hold Space)" title="Hold to talk (or hold Space)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <input id="input" autocomplete="off" placeholder="Speak, and Escanor shall answer…  (hold Space to talk)">
    <button id="send" type="submit">Send</button>
  </form>

  <dialog id="confirm">
    <div class="panel-title">BY YOUR LEAVE</div>
    <p id="confirm-text"></p>
    <div class="row">
      <button id="deny" type="button">Deny</button>
      <button id="allow" type="button" class="primary">Allow</button>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
